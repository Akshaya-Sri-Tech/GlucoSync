spring.application.name=glucosync-backend
server.port=8080

# Load the existing .env file
spring.config.import=optional:file:./.env[.properties]

# Database configuration
spring.datasource.url=${GLUCOSYNC_DB_URL}
spring.datasource.username=${GLUCOSYNC_DB_USER}
spring.datasource.password=${GLUCOSYNC_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=5